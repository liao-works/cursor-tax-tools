name: Managed XI snapshot & resumable shard audit (manual SHADOW)

on:
  workflow_dispatch:
    inputs:
      catalogue_run_id:
        description: 'Original trusted catalogue artifact run ID (empty = create fresh catalogue)'
        required: false
        type: string
      prior_checkpoint_run_id:
        description: 'Optional previous merged-checkpoint run ID, using SAME frozen catalogue'
        required: false
        type: string
      start_index:
        description: 'auto (first gap/failure), or explicit zero-based XI catalogue start index'
        required: true
        default: 'auto'
        type: string
      sample_limit:
        description: 'Maximum managed XI commodity requests in this shard'
        required: true
        default: '40'
        type: choice
        options: ['10', '40', '100', '500']

permissions:
  contents: read
  actions: read

concurrency:
  group: xi-managed-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  managed-xi-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      HMRC_CLIENT_ID: ${{ secrets.HMRC_CLIENT_ID }}
      HMRC_CLIENT_SECRET: ${{ secrets.HMRC_CLIENT_SECRET }}
      START_INDEX: ${{ inputs.start_index }}
      SHARD_LIMIT: ${{ inputs.sample_limit }}
      CATALOGUE_RUN_ID: ${{ inputs.catalogue_run_id }}
      PRIOR_CHECKPOINT_RUN_ID: ${{ inputs.prior_checkpoint_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate parameters and require managed credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HMRC_CLIENT_ID" || -z "$HMRC_CLIENT_SECRET" ]]; then
            echo "::error::Managed HMRC_CLIENT_ID and HMRC_CLIENT_SECRET required"
            exit 1
          fi
          if [[ "$START_INDEX" != "auto" && ! "$START_INDEX" =~ ^[0-9]{1,8}$ ]]; then
            echo "::error::start_index must be auto or a nonnegative integer"
            exit 1
          fi
          if [[ -n "$CATALOGUE_RUN_ID" && ! "$CATALOGUE_RUN_ID" =~ ^[0-9]{1,16}$ ]]; then
            echo "::error::invalid original catalogue run ID"
            exit 1
          fi
          if [[ -n "$PRIOR_CHECKPOINT_RUN_ID" && ! "$PRIOR_CHECKPOINT_RUN_ID" =~ ^[0-9]{1,16}$ ]]; then
            echo "::error::invalid previous checkpoint run ID"
            exit 1
          fi
          if [[ -z "$CATALOGUE_RUN_ID" && "$START_INDEX" != 'auto' && "$START_INDEX" != '0' ]]; then
            echo "::error::nonzero start requires a reused frozen catalogue"
            exit 1
          fi
          if [[ -z "$CATALOGUE_RUN_ID" && -n "$PRIOR_CHECKPOINT_RUN_ID" ]]; then
            echo "::error::resuming a checkpoint requires the original frozen catalogue"
            exit 1
          fi
      - name: Offline source, merge and freeze contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_xi_frozen_catalogue.py' -v
          python -m unittest discover -s tests -p 'test_xi_merge.py' -v
          python -m unittest discover -s tests -p 'test_xi_acceptance.py' -v
          python -m unittest discover -s tests -p 'test_xi_run_plan.py' -v
      - name: Retrieve original frozen managed XI catalogue from an earlier run
        if: ${{ inputs.catalogue_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: xi-managed-catalogue-${{ inputs.catalogue_run_id }}
          run-id: ${{ inputs.catalogue_run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Enumerate all official managed XI chapters (initial run only)
        if: ${{ inputs.catalogue_run_id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m src.target_duty.xi_catalogue \
            --as-of "$(date -u +%F)" \
            --min-chapter-interval 1.2 \
            --output xi-full-catalogue-shadow.db
          python -m src.target_duty.xi_frozen_catalogue freeze \
            --catalogue xi-full-catalogue-shadow.db \
            --manifest xi-frozen-manifest.json
      - name: Verify exact frozen source catalogue snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -m src.target_duty.xi_frozen_catalogue verify \
            --catalogue xi-full-catalogue-shadow.db \
            --manifest xi-frozen-manifest.json
      - name: Retrieve earlier fully replay-verified XI checkpoint (optional)
        if: ${{ inputs.prior_checkpoint_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: xi-managed-checkpoint-${{ inputs.prior_checkpoint_run_id }}
          run-id: ${{ inputs.prior_checkpoint_run_id }}
          github-token: ${{ github.token }}
          path: previous/
      - name: Plan next bounded XI shard from replay-verified missing or failed source responses
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--catalogue xi-full-catalogue-shadow.db
                --manifest xi-frozen-manifest.json
                --batch-size "$SHARD_LIMIT" --output xi-shard-plan.json)
          if [[ -n "$PRIOR_CHECKPOINT_RUN_ID" ]]; then
            ARGS+=(--checkpoint previous/xi-merged-shadow.db)
          fi
          if [[ "$START_INDEX" != "auto" ]]; then
            ARGS+=(--start-index "$START_INDEX")
          fi
          python -m src.target_duty.xi_run_plan "${ARGS[@]}"
          python - <<'PY'
          import json,os
          from pathlib import Path
          plan=json.loads(Path("xi-shard-plan.json").read_text())
          segment=plan["next_shard"]
          if segment is None:
              raise SystemExit("All XI source codes captured; nothing to fetch. Run independent final acceptance.")
          if not 1<=segment["pending_codes_in_window"]<=segment["limit"]:
              raise SystemExit("Planned XI batch contains no work")
          with Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write(f'ACTUAL_START_INDEX={segment["start_index"]}\n')
              env.write(f'ACTUAL_SHARD_LIMIT={segment["limit"]}\n')
          print("Verified XI checkpoint:",plan["verified_successful_codes"],
                "failures:",plan["failed_requests"],
                "missing:",plan["missing_requests"],
                "next absolute start:",segment["start_index"])
          PY
      - name: Download fixed bounded XI shard with managed OAuth (source errors recorded)
        id: crawl
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(python -c 'import json;print(json.load(open("xi-frozen-manifest.json"))["as_of"])')"
          RESUME_ARGS=()
          if [[ -n "$PRIOR_CHECKPOINT_RUN_ID" ]]; then
            RESUME_ARGS=(--skip-successes-from previous/xi-merged-shadow.db)
          fi
          python -m src.target_duty.xi_measure_crawl \
            --catalogue xi-full-catalogue-shadow.db \
            --as-of "$DAY" \
            --start-index "$ACTUAL_START_INDEX" --limit "$ACTUAL_SHARD_LIMIT" \
            "${RESUME_ARGS[@]}" \
            --min-interval 2.0 \
            --output xi-current-shard.db
      - name: Merge and replay verify original + current checkpoint
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(python -c 'import json;print(json.load(open("xi-frozen-manifest.json"))["as_of"])')"
          if [[ -n "$PRIOR_CHECKPOINT_RUN_ID" ]]; then
            test -f previous/xi-merged-shadow.db
            python -m src.target_duty.xi_merge \
              --catalogue xi-full-catalogue-shadow.db \
              --as-of "$DAY" \
              --shards previous/xi-merged-shadow.db xi-current-shard.db \
              --resolve-failures \
              --output xi-merged-shadow.db
          else
            python -m src.target_duty.xi_merge \
              --catalogue xi-full-catalogue-shadow.db \
              --as-of "$DAY" \
              --shards xi-current-shard.db \
              --output xi-merged-shadow.db
          fi
      - name: Verify merged raw source scope (never certify NI Other)
        shell: bash
        run: |
          set -euo pipefail
          python -m src.target_duty.xi_acceptance \
            --catalogue xi-full-catalogue-shadow.db \
            --measures xi-merged-shadow.db \
            --output xi-managed-coverage-gate.json
      - name: Archive immutable original catalogue for future runs (max 30-day Actions retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xi-managed-catalogue-${{ github.run_id }}
          path: |
            xi-full-catalogue-shadow.db
            xi-full-catalogue-shadow.json
            xi-frozen-manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Archive read-only merged XI checkpoint and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xi-managed-checkpoint-${{ github.run_id }}
          path: |
            xi-current-shard.db
            xi-current-shard.db.metadata.json
            xi-shard-plan.json
            xi-managed-coverage-gate.json
            xi-merged-shadow.db
            xi-merged-shadow.json
            xi-managed-coverage-gate.json
          if-no-files-found: warn
          retention-days: 30
      - name: Report incomplete or failed source after retaining the evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.crawl.outcome }}" != "success" ]]; then
            echo "::error::XI source failures; audit artifact retained for repair"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("xi-merged-shadow.json").read_text())
          print("Checkpoint: successful",report["successful_codes"],
                "remaining",report["remaining_codes"],
                "source errors",report["failed_codes"])
          if report["failed_codes"]:
              raise SystemExit("Source errors still present in merged XI checkpoint")
          if report["production_eligible"] or report["other_semantics_verified"]:
              raise SystemExit("Illegal production-eligible XI evidence")
          PY
