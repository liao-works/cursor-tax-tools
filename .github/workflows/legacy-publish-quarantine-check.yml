name: P0 legacy release quarantine proof (READ ONLY)
on:
  push:
    branches:
      - fix/p0-quarantine-legacy-tariff-publish-20261015
  pull_request:
    paths:
      - '.github/workflows/scrape-tariff.yml'
      - '.github/workflows/scrape-tariff-parallel.yml'
      - '.github/workflows/scrape-tariff-parallel-improved.yml'
      - '.github/workflows/legacy-publish-quarantine-check.yml'
      - 'src/target_duty/legacy_publish_guard.py'
      - 'tests/test_legacy_publish_guard.py'
permissions:
  contents: read
jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression injection for monthly writers, partial coverage and swallowed errors
        run: python -m unittest discover -s tests -p 'test_legacy_publish_guard.py' -v
      - name: Block any unsafe old workflow from returning to release publishing
        run: python -m src.target_duty.legacy_publish_guard --directory .github/workflows
