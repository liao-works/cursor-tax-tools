name: XI expanded public source probe (five chapters, review only)

on:
  pull_request:
    paths:
      - '.github/workflows/xi-public-five-chapter-probe.yml'
      - 'src/target_duty/xi_catalogue.py'
      - 'src/target_duty/xi_measure_crawl.py'
      - 'src/target_duty/xi_acceptance.py'
      - 'src/target_duty/xi_coverage_receipt.py'
      - 'src/target_duty/xi_run_plan.py'
      - 'src/target_duty/xi_source_lookup.py'
      - 'tests/test_xi_source_lookup.py'

permissions:
  contents: read

jobs:
  xi-source-five-chapter-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch five official public XI chapters (partial, no OAuth)
        run: |
          set -euo pipefail
          python -m src.target_duty.xi_catalogue \
            --public-canary --max-chapters 5 \
            --as-of 2026-10-14 --min-chapter-interval 2.0 \
            --output xi-five-chapter-catalogue.db
      - name: Fetch twenty bounded official commodity source records
        id: collect
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m src.target_duty.xi_measure_crawl \
            --public-canary \
            --catalogue xi-five-chapter-catalogue.db \
            --as-of 2026-10-14 --limit 20 --min-interval 2.0 \
            --output xi-five-chapter-measures.db
      - name: Independently replay raw source and audit chapter gaps
        run: |
          set -euo pipefail
          python -m src.target_duty.xi_acceptance \
            --catalogue xi-five-chapter-catalogue.db \
            --measures xi-five-chapter-measures.db \
            --min-chapters 1 --output xi-five-chapter-acceptance.json
          python -m src.target_duty.xi_coverage_receipt \
            --catalogue xi-five-chapter-catalogue.db \
            --checkpoint xi-five-chapter-measures.db \
            --public-canary --output xi-five-chapter-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('xi-five-chapter-coverage.json').read_text())
          assert result['source_scope']=='partial_or_fixture'
          assert result['chapters_collected']==5
          assert result['successful_responses'] + result['failed_responses']==20
          assert result['missing_responses']==result['active_declarable_codes']-20
          assert result['managed_full_source_coverage_pass'] is False
          assert result['ni_other_verified'] is False
          assert result['production_eligible'] is False
          print('Verified five-chapter only source:',result['active_declarable_codes'],
                'codes; successes:',result['successful_responses'],
                'failures:',result['failed_responses'],
                'missing:',result['missing_responses'])
          PY
      - name: Query real XI raw measures and distinguish uncollected codes
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          with sqlite3.connect("xi-five-chapter-measures.db") as db:
              captured=db.execute("SELECT code FROM requests WHERE status='ok' ORDER BY code LIMIT 1").fetchone()
          with sqlite3.connect("xi-five-chapter-catalogue.db") as db:
              all_codes=[x[0] for x in db.execute(
                  "SELECT DISTINCT code FROM nomenclature WHERE active=1 AND declarable=1 ORDER BY code")]
          if not captured:
              raise SystemExit("No verified XI source response to query")
          with sqlite3.connect("xi-five-chapter-measures.db") as db:
              measured={x[0] for x in db.execute("SELECT code FROM requests")}
          absent=next((x for x in all_codes if x not in measured),None)
          if not absent:
              raise SystemExit("No uncollected XI sample code to exercise missing status")
          Path("xi-query-codes.txt").write_text(
              captured[0]+"\n"+absent+"\n"+"0000000000"+"\n")
          PY
          python -m src.target_duty.xi_source_lookup \
            --catalogue xi-five-chapter-catalogue.db \
            --checkpoint xi-five-chapter-measures.db \
            --min-chapters 1 --codes-file xi-query-codes.txt \
            --output xi-five-chapter-lookup.json
          python - <<'PY'
          import json
          p=json.load(open("xi-five-chapter-lookup.json"))
          got=p["results"]
          assert got[0]["status"] in (
              "unfiltered_raw_source_candidates","source_response_no_import_measures")
          assert got[1]["status"]=="source_not_collected"
          assert got[2]["status"]=="not_in_enumerated_active_declarable_xi_catalogue"
          assert all(x["payable_rate"] is None for x in got)
          assert p["managed_full_source_coverage_proven"] is False
          assert p["ni_other_verified"] is False
          print("NI source query audit verified", [x["status"] for x in got])
          PY
      - name: Upload original partial source and missing-code evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xi-expanded-5-chapter-source-${{ github.run_id }}
          path: |
            xi-five-chapter-catalogue.db
            xi-five-chapter-catalogue.json
            xi-five-chapter-measures.db
            xi-five-chapter-measures.db.metadata.json
            xi-five-chapter-acceptance.json
            xi-five-chapter-coverage.json
            xi-five-chapter-lookup.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fail if a source endpoint was unavailable
        if: always()
        env:
          COLLECT_RESULT: ${{ steps.collect.outcome }}
        run: |
          test "$COLLECT_RESULT" = success
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('xi-five-chapter-coverage.json')
          if not path.is_file():
              raise SystemExit('No independent five-chapter coverage evidence')
          r=json.loads(path.read_text())
          if r['failed_responses']!=0:
              raise SystemExit('Five-chapter public source failures; review archived errors')
          PY
