name: 补齐北爱尔兰税率

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: '批量大小'
        required: false
        default: '50'
      delay:
        description: '批次间延迟(秒)'
        required: false
        default: '0.1'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 下载现有数据库
      run: |
        echo "INFO: 下载现有数据库..."
        curl -L -o tariffs.db \
          "https://github.com/${{ github.repository }}/releases/download/latest-data/tariffs.db" || {
          echo "ERROR: 下载失败"
          exit 1
        }

    - name: 试运行（查询缺失记录）
      run: |
        python scripts/actions/backfill_ni_rates.py \
          --db-path tariffs.db \
          --dry-run

    - name: 执行补齐
      env:
        BATCH_SIZE: ${{ github.event.inputs.batch_size || '50' }}
        DELAY: ${{ github.event.inputs.delay || '0.1' }}
      run: |
        echo "INFO: 开始补齐北爱尔兰税率..."

        python scripts/actions/backfill_ni_rates.py \
          --db-path tariffs.db \
          --batch-size $BATCH_SIZE \
          --delay $DELAY

    - name: 验证数据库
      run: |
        echo "INFO: 验证更新后的数据库..."
        python scripts/actions/validate_database.py tariffs.db

    - name: 生成元数据
      env:
        VERSION: backfill-${{ github.run_id }}
      run: |
        # 生成合并结果（用于元数据生成）
        echo '{"total_shards": 1, "successful_shards": 1}' > merge_results.json

        python scripts/actions/generate_metadata.py \
          tariffs.db \
          "$VERSION" \
          merge_results.json \
          metadata.json

    - name: 上传补齐报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backfill-report
        path: |
          backfill_ni_report_*.json
          validation_results.json
        retention-days: 30

    - name: 发布更新（可选）
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: backfill-${{ github.run_id }}
        name: "北爱尔兰税率补齐 - ${{ github.run_id }}"
        body: |
          # 北爱尔兰税率补齐

          **补齐时间**: ${{ github.event.repository.updated_at }}
          **运行ID**: ${{ github.run_id }}

          此版本补齐了缺失的北爱尔兰税率数据。

          ## 下载
          - [tariffs.db](https://github.com/${{ github.repository }}/releases/download/backfill-${{ github.run_id }}/tariffs.db)
          - [metadata.json](https://github.com/${{ github.repository }}/releases/download/backfill-${{ github.run_id }}/metadata.json)
        files: |
          tariffs.db
          metadata.json
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

