name: XI public full raw measure evidence (UNTRUSTED SHADOW)
on:
  # Explicit operator launch: one commit to this control file triggers BOTH full raw-source audits.
  # Read-only: no production rate release or desktop database replacement.
  push:
    branches: [feat/parallel-scraper]
    paths: ['ops/manual-full-source-run.txt']
  workflow_dispatch:
  # Every Sunday 02:00 UTC / 10:00 Singapore: new XI public source snapshot.
  # Scheduled runs start a fresh frozen catalogue; manual runs can resume.
  schedule:
    - cron: '0 2 * * 0'
permissions:
  contents: read
  actions: read
concurrency:
  group: xi-public-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve optional prior raw-source run
        id: prior
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          value=Path("ops/xi-public-full-launch.txt").read_text()
          # Scheduled runs MUST obtain a fresh catalogue and all measures.
          # Same-run checkpoint recovery requires manual dispatch.
          match=(re.search(r"(?m)^resume_from_run_id=([0-9]{10,16})$",value)
                 if os.getenv("GITHUB_EVENT_NAME") == "workflow_dispatch" else None)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("run_id="+(match.group(1) if match else "")+"\n")
          PY
      - name: Restore byte-identical original official public catalogue
        if: steps.prior.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: xi-public-full-catalogue-${{ steps.prior.outputs.run_id }}
          run-id: ${{ steps.prior.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Fetch all official XI PUBLIC chapters and freeze exact bytes
        if: steps.prior.outputs.run_id == ''
        run: |
          set -euo pipefail
          python -m src.target_duty.xi_catalogue --as-of "$(date -u +%F)" --public-full-audit --min-chapter-interval 2.0 --output xi-public-full-catalogue.db
          python -m src.target_duty.xi_public_full_capture freeze --catalogue xi-public-full-catalogue.db --manifest xi-public-frozen-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: xi-public-full-catalogue-${{ github.run_id }}
          path: |
            xi-public-full-catalogue.db
            xi-public-full-catalogue.json
            xi-public-frozen-manifest.json
          if-no-files-found: error
          retention-days: 30
  collect:
    needs: catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      # Eight bounded partitions, at most four simultaneous API clients.
      max-parallel: 4
      matrix:
        worker: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: xi-public-full-catalogue-${{ github.run_id }}
          path: .
      - name: Resolve checkpoint reuse from prior run, if any
        id: prior
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          value=Path("ops/xi-public-full-launch.txt").read_text()
          # Scheduled runs MUST obtain a fresh catalogue and all measures.
          # Same-run checkpoint recovery requires manual dispatch.
          match=(re.search(r"(?m)^resume_from_run_id=([0-9]{10,16})$",value)
                 if os.getenv("GITHUB_EVENT_NAME") == "workflow_dispatch" else None)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("run_id="+(match.group(1) if match else "")+"\n")
          PY
      - name: Retrieve previously captured same-index public raw responses
        if: steps.prior.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: xi-public-full-shard-${{ matrix.worker }}-${{ steps.prior.outputs.run_id }}
          run-id: ${{ steps.prior.outputs.run_id }}
          github-token: ${{ github.token }}
          path: previous/
      - name: Resume previous verified shard checkpoint, when present
        run: |
          if [[ -f "previous/xi-public-shard-${{ matrix.worker }}.db" ]]; then
            cp "previous/xi-public-shard-${{ matrix.worker }}.db" "xi-public-shard-${{ matrix.worker }}.db"
          fi
      - name: Collect raw XI commodity measure responses
        id: crawl
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m src.target_duty.xi_public_full_capture shard --catalogue xi-public-full-catalogue.db --manifest xi-public-frozen-manifest.json --worker "${{ matrix.worker }}" --workers 8 --batch-size 250 --interval 2.5 --output "xi-public-shard-${{ matrix.worker }}.db"
      - name: Preserve original responses and failed response receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xi-public-full-shard-${{ matrix.worker }}-${{ github.run_id }}
          path: |
            xi-public-shard-*.db
            xi-public-shard-*.json
            xi-public-shard-*.public-review.json
            xi-public-shard-*.db.metadata.json
          retention-days: 30
          if-no-files-found: warn
      - name: Reject failed source partitions
        env:
          CRAWL: ${{ steps.crawl.outcome }}
        run: |
          set -euo pipefail
          if [[ "$CRAWL" != success ]]; then
            echo "::error::XI public raw response error; evidence saved, no release"
            exit 1
          fi
          python - <<'PY'
          import glob,json
          paths=glob.glob("xi-public-shard-*.public-review.json")
          assert len(paths)==1
          r=json.load(open(paths[0]))
          assert r["complete"] and r["successful"]==r["expected"]
          assert r["failed"]==r["missing"]==0
          assert not r["managed_source_verified"] and not r["production_eligible"]
          PY
  audit:
    needs: [catalogue, collect]
    if: always() && needs.catalogue.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: xi-public-full-catalogue-${{ github.run_id }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: xi-public-full-shard-*-${{ github.run_id }}
          path: shards
      - name: Independently replay each available raw source shard and export ALL per-code gaps
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import glob
          from src.target_duty.xi_public_gap_ledger import gaps
          parts=sorted(glob.glob("shards/xi-public-full-shard-*-*/xi-public-shard-*.db"))
          result=gaps(
            "xi-public-full-catalogue.db", "xi-public-frozen-manifest.json",
            parts, output_report="xi-public-all-code-gaps.json",
            output_csv="xi-public-all-code-gaps.csv")
          print("Actual PUBLIC source replay:",result["replayed_successful_responses"],
                "/",result["expected_commodity_codes"],
                "missing",result["missing_responses"],
                "source errors",result["source_errors"],
                "chapters incomplete",result["incomplete_chapters"])
          PY
      - name: Replay, merge and check all eight source partitions
        id: merge
        continue-on-error: true
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json,subprocess,sys
          paths=sorted(glob.glob("shards/xi-public-full-shard-*-*/xi-public-shard-*.db"))
          if len(paths)!=8:
              raise SystemExit(f"Required 8 actual source shards, got {len(paths)}")
          day=json.load(open("xi-public-frozen-manifest.json"))["as_of"]
          subprocess.run([sys.executable,"-m","src.target_duty.xi_merge",
            "--catalogue","xi-public-full-catalogue.db","--as-of",day,
            "--shards",*paths,"--output","xi-public-full-merged.db"],check=True)
          PY
      - name: Independently accept zero-gap public raw responses
        id: acceptance
        if: steps.merge.outcome == 'success'
        continue-on-error: true
        run: |
          python -m src.target_duty.xi_public_full_capture accept --catalogue xi-public-full-catalogue.db --manifest xi-public-frozen-manifest.json --merged xi-public-full-merged.db --output xi-public-full-acceptance.json
      - name: Derive compact NEW-date canary + expiry baseline only after full acceptance
        id: daily_baseline
        if: steps.acceptance.outcome == 'success'
        run: |
          set -euo pipefail
          python -m src.target_duty.xi_daily_baseline \
            --merged xi-public-full-merged.db \
            --manifest xi-public-frozen-manifest.json \
            --acceptance xi-public-full-acceptance.json \
            --run-id "${{ github.run_id }}" \
            --output xi-daily-watch-baseline.json
      - name: Preserve small daily baseline independently of giant raw shards
        if: steps.daily_baseline.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: xi-daily-watch-baseline-${{ github.run_id }}
          path: xi-daily-watch-baseline.json
          retention-days: 30
          if-no-files-found: error
      - name: Preserve final source evidence, never publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xi-public-full-acceptance-${{ github.run_id }}
          path: |
            xi-public-full-merged.db
            xi-public-full-merged.json
            xi-public-full-acceptance.json
            xi-public-all-code-gaps.json
            xi-public-all-code-gaps.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Fail closed on source gaps
        env:
          COLLECT: ${{ needs.collect.result }}
          MERGE: ${{ steps.merge.outcome }}
          ACCEPT: ${{ steps.acceptance.outcome }}
          BASELINE: ${{ steps.daily_baseline.outcome }}
        run: |
          set -euo pipefail
          if [[ "$COLLECT" != success || "$MERGE" != success || "$ACCEPT" != success || "$BASELINE" != success ]]; then
            echo "::error::Public XI source incomplete or invalid; no publish"
            exit 1
          fi
          python - <<'PY'
          import json
          a=json.load(open("xi-public-full-acceptance.json"))
          assert a["public_full_raw_source_coverage"]
          assert not a["managed_full_source_coverage_proven"]
          assert not a["ni_other_verified"] and not a["production_eligible"]
          print("Raw PUBLIC XI source coverage:",a["responses_replayed"],"/",a["expected"])
          print("NOT a certified NI Other payable rate")
          PY
