name: Focused third-country duty tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact Ed25519 verification package for envelope tests
        run: python -m pip install 'cryptography==46.0.4'
      - name: Run offline fixture tests
        run: |
          python -m unittest discover -s tests -p 'test_target_duty.py' -v
          python -m unittest discover -s tests -p 'test_xi_probe.py' -v
          python -m unittest discover -s tests -p 'test_xi_audit.py' -v
          python -m unittest discover -s tests -p 'test_xi_review_gate.py' -v
          python -m unittest discover -s tests -p 'test_target_reconcile.py' -v
          python -m unittest discover -s tests -p 'test_preview_bundle.py' -v
          python -m unittest discover -s tests -p 'test_signed_review.py' -v
      - name: Verify official DBT *filtered* live sample
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import csv, io, urllib.parse, urllib.request
          from src.target_duty.build import build_url
          url = build_url() + "&commodity__code=0101210000"
          request = urllib.request.Request(url, headers={
              "Accept": "text/csv", "User-Agent": "liao-tariff-shadow-smoke/1.0"})
          with urllib.request.urlopen(request, timeout=60) as response:
              assert response.status == 200
              body = response.read(2_000_001)
          assert len(body) <= 2_000_000, "Unexpectedly large filtered sample"
          reader = csv.DictReader(io.StringIO(body.decode("utf-8-sig")))
          rows = list(reader)
          assert rows, "No DBT measures for known public commodity"
          assert all(r["commodity__code"] == "0101210000" for r in rows)
          assert all(r["measure__type__id"] == "103" for r in rows)
          assert all(r["measure__geographical_area__id"] == "1011" for r in rows)
          print(f"GB official target measures: {len(rows)} (no unfiltered download)")
          print("Source sample fields:", {
              "conditions": repr(rows[0].get("measure__conditions", ""))[:100],
              "additional": repr(rows[0].get("measure__additional_code__code", ""))[:100],
              "duty": repr(rows[0].get("measure__duty_expression", ""))[:100]
          })
          PY
      - name: Probe one XI public API sample (not a publish gate)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          python -m src.target_duty.xi_probe --public --code 0101210000 --output xi-candidate-report.json
          python - <<'PY'
          import json
          report = json.load(open('xi-candidate-report.json'))
          print('XI measure types:', report['measure_types_observed'])
          print('XI geographies:', report['geographical_areas_observed'])
          print('XI type 103 count:', len(report['candidates']))
          print('XI one-off candidate rate:', report['candidate_rate'])
          print('XI duty internals:', report['candidates'][:1])
          print('Read-only audit:', report['status'], report['rate'])
          PY
      - name: Check two more XI reference codes without writing duty data
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          for CODE in 0101299000 0102291010; do
            python -m src.target_duty.xi_probe --public --code "$CODE" --output "xi-${CODE}.json"
            python -c 'import json,sys; x=json.load(open(sys.argv[1])); print("XI reference:",x["commodity_code"],"types:",x["measure_types_observed"].get("103",0),"candidate rate:",x["candidate_rate"],"details:",x["candidates"])' "xi-${CODE}.json"
          done
      - name: Upload public XI audit when accessible
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xi-public-canary-${{ github.run_id }}
          path: |
            xi-candidate-report.json
            xi-*.json
          if-no-files-found: ignore
          retention-days: 5
      - name: Validate DBT filtered-query parameters
        run: |
          python - <<'PY'
          from src.target_duty.build import build_url
          from urllib.parse import parse_qs, urlparse
          q = parse_qs(urlparse(build_url()).query, keep_blank_values=True)
          assert q['measure__type__id'] == ['103']
          assert q['measure__geographical_area__id'] == ['1011']
          assert 'query-simple' in q
          PY

  shadow-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download pinned, SHA-verified legacy reference for comparison only
        run: python -m src.target_duty.legacy --output legacy-tariffs.db
      - name: Build real GB-only filtered shadow snapshot
        run: |
          python -m src.target_duty.build --legacy-db legacy-tariffs.db --output target-duty.db
          python -m src.target_duty.reconcile --old legacy-tariffs.db --new target-duty.db --output target-duty-diff.json
          python -m src.target_duty.preview_bundle --output target-duty-preview.zip
          python - <<'PY'
          import json, sqlite3
          info = json.load(open("target-duty.metadata.json"))
          print("Source: ", info["source"])
          print("Quality: ", info["quality_metrics"])
          db=sqlite3.connect("target-duty.db")
          for row in db.execute("SELECT uk_rate_status,COUNT(*) FROM tariffs GROUP BY uk_rate_status"):
              print("GB status:", row)
          for row in db.execute("SELECT ni_rate_status,COUNT(*) FROM tariffs GROUP BY ni_rate_status"):
              print("NI status:", row)
          db.close()
          PY
      - name: Upload SHADOW ONLY, never production
        uses: actions/upload-artifact@v4
        with:
          name: gb-third-country-shadow-${{ github.run_id }}
          path: |
            legacy-tariffs.db
            target-duty.db
            target-duty.metadata.json
            target-duty-diff.json
            target-duty-diff.csv
            target-duty-preview.zip
          retention-days: 7

  xi-audit-canary:
    if: github.event_name == 'workflow_dispatch'
    name: XI candidate sample (review only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch authenticated-by-SHA old reference
        run: python -m src.target_duty.legacy --output legacy-tariffs.db
      - name: Audit 24 XI references across different HS chapters
        continue-on-error: true
        run: |
          python -m src.target_duty.xi_audit --legacy-db legacy-tariffs.db --public --limit 24 --delay 1.2 --output xi-audit.json
          python -m src.target_duty.xi_review_gate --audit xi-audit.json --min-chapters 24 --output xi-review-gate.json
          python - <<'PY'
          import json
          result=json.load(open('xi-audit.json'))
          print('XI audit only:',result['coverage'],'samples')
          print('XI result breakdown:',result['stats'])
          print('Production eligible?',result['production_eligible'])
          PY
      - name: Archive XI review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xi-stratified-review-${{ github.run_id }}
          path: |
            xi-audit.json
            xi-review-gate.json
            xi-review-gate.md
          if-no-files-found: ignore
          retention-days: 7
