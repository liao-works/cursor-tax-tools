name: Daily official GB/NI source-change and effective-date watch (SHADOW ONLY)
on:
  # 00:30 UTC = 08:30 Singapore, each day, even if GB version is unchanged.
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
  push:
    branches: [feat/target-third-country-duty-v1]
    paths: [ops/daily-official-source-launch.txt]
permissions:
  contents: read
concurrency:
  group: official-daily-source-watch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Official version, failed XI response, actual candidate expiry and no-release tests
        run: python -m unittest discover -s tests -p 'test_daily_official_change_watch.py' -v
      - name: Fetch official GB latest version and 6 independently pinned public XI raw responses
        id: daily
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m src.target_duty.daily_official_change_watch \
            --baseline ops/xi-daily-canary-baseline-20261014.json \
            --gb-baseline-version v4.0.1627 \
            --as-of "$(date -u +%F)" \
            --output daily-official-source-signals.json
      - name: Preserve SHA fingerprints and review triggers even on source error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-official-source-signals-${{ github.run_id }}
          path: daily-official-source-signals.json
          retention-days: 30
          if-no-files-found: warn
      - name: Explicit watch verdict, NEVER publish or mark payable rates
        env:
          DAILY_OUTCOME: ${{ steps.daily.outcome }}
        run: |
          set -euo pipefail
          if [[ "$DAILY_OUTCOME" != "success" ]]; then
            echo "::error::Official GB/NI daily source API/schema unavailable; fail closed without publishing"
            exit 1
          fi
          python - <<'PY'
          import json
          report=json.load(open("daily-official-source-signals.json"))
          assert report["release_permitted"] is False
          assert report["production_database_mutated"] is False
          assert report["ni_other_payable_verified"] is False
          assert report["xi_sample_covers_entire_source"] is False
          if report["review_reasons"]:
              for reason in report["review_reasons"]:
                  print("::warning::Official GB/NI tariff review required: "+reason)
          else:
              print("::notice::No change observed within limited sampled scope; weekly full review still mandatory")
          PY
