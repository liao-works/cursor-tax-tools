name: Weekly GB full official source refresh and pinned replay (SHADOW ONLY)
on:
  # Explicit operator launch: one commit to this control file triggers BOTH full raw-source audits.
  # Read-only: no production rate release or desktop database replacement.
  push:
    branches: [feat/parallel-scraper]
    paths:
      - ops/manual-full-source-run.txt
      - ops/manual-gb-full-run.txt
  # Every Sunday 01:00 UTC / 09:00 Singapore; source-only, never publish.
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:
    inputs:
      version_pin:
        description: "Optional immutable DBT version to replay (e.g. v4.0.1629) while the newest release is incomplete; the pinned version must independently pass table and CSVW schema validation"
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: weekly-gb-full-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gb-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Official DBT metadata and expanded measures parser regression
        run: |
          python -m unittest discover -s tests -p 'test_gb_full_measures.py' -v
          python -m unittest discover -s tests -p 'test_dbt_version_discovery.py' -v
          python -m unittest discover -s tests -p 'test_geo_area_memberships.py' -v
      - name: Discover current official DBT version and required CSVW schema
        shell: bash
        env:
          VERSION_PIN: ${{ inputs.version_pin }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_PIN" ]; then
            python -m src.target_duty.dbt_version_discovery \
              --pinned-version "$VERSION_PIN" \
              --output gb-weekly-version-discovery.json --require-available
            echo "PINNED OFFICIAL GB SOURCE (operator pin) $VERSION_PIN"
          else
            python -m src.target_duty.dbt_version_discovery \
              --output gb-weekly-version-discovery.json --require-available
          fi
          python - <<'PY'
          import json,re
          from pathlib import Path
          info=json.loads(Path("gb-weekly-version-discovery.json").read_text())
          version=info.get("newest_official_version")
          if (info.get("state")!="ready_for_full_data_replay"
                  or not isinstance(version,str)
                  or not re.fullmatch(r"v[0-9]+(?:\.[0-9]+)*",version)):
              raise SystemExit("Official DBT version not safe for full replay")
          Path("gb-weekly-pin.txt").write_text(version+"\n")
          print("REPLAY OFFICIAL GB SOURCE",version)
          PY
          date -u +%F > gb-weekly-as-of.txt
      - name: Fetch ALL official GB declarable commodity rows at same pinned version
        shell: bash
        run: |
          set -euo pipefail
          python -m src.target_duty.catalog build \
            --version "$(cat gb-weekly-pin.txt)" \
            --as-of "$(cat gb-weekly-as-of.txt)" \
            --output gb-weekly-catalogue.db
      - name: Download complete original GB DBT expanded-measures CSV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from src.target_duty.gb_full_measures import download
          version=Path("gb-weekly-pin.txt").read_text().strip()
          report=download(version,"gb-weekly-original-measures.csv")
          Path("gb-weekly-source-download.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - name: Download same-version official geo-area reference tables for numeric membership joins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,hashlib,json,urllib.request
          from pathlib import Path
          version=Path("gb-weekly-pin.txt").read_text().strip()
          reports={}
          for table in ("geo-areas","geo-area-descriptions"):
              url=(f"https://data.api.trade.gov.uk/v1/datasets/uk-tariff-2021-01-01/"
                   f"versions/{version}/tables/{table}/data?format=csv")
              request=urllib.request.Request(url,headers={
                  "Accept":"text/csv","User-Agent":"liao-gb-geo-reference-audit/1.0"})
              with urllib.request.urlopen(request,timeout=120) as response:
                  if response.status!=200 or f"/versions/{version}/" not in response.geturl():
                      raise SystemExit(f"Unpinned or failed official table response: {table}")
                  payload=response.read(100_000_001)
                  resolved=response.geturl()
              if not payload or len(payload)>100_000_000 or bytes([0]) in payload:
                  raise SystemExit(f"Empty, oversized or binary official table: {table}")
              path=Path(f"gb-weekly-{table}.csv")
              path.write_bytes(payload)
              reader=csv.reader(payload.decode("utf-8-sig").splitlines())
              header=next(reader,None)
              if not header or len(header)!=len(set(header)):
                  raise SystemExit(f"Invalid official {table} CSV header")
              samples=[]
              for row in reader:
                  samples.append(row)
                  if len(samples)>=5:
                      break
              reports[table]={
                  "version":version,"source_url":url,"resolved_url":resolved,
                  "bytes":len(payload),"sha256":hashlib.sha256(payload).hexdigest(),
                  "header":header,"sample_rows":samples}
              print(f"OFFICIAL {table} HEADER:",json.dumps(header))
              print(f"OFFICIAL {table} SAMPLE:",json.dumps(samples[:3]))
          Path("gb-weekly-geo-area-reference.json").write_text(
              json.dumps(reports,ensure_ascii=False,indent=2)+chr(10),encoding="utf-8")
          PY
      - name: Download same-version official geographical group memberships for China applicability
        shell: bash
        run: |
          set -euo pipefail
          python -m src.target_duty.geo_area_memberships \
            --version "$(cat gb-weekly-pin.txt)" \
            --as-of "$(cat gb-weekly-as-of.txt)" \
            --output gb-weekly-geo-area-memberships.csv \
            --report gb-weekly-geo-area-memberships.json \
            --geo-areas gb-weekly-geo-areas.csv \
            --geo-area-descriptions gb-weekly-geo-area-descriptions.csv \
            --reference gb-weekly-geo-area-reference.json
      - name: Independently replay EVERY original GB measure into isolated review database
        shell: bash
        run: |
          set -euo pipefail
          python -m src.target_duty.gb_full_measures \
            --version "$(cat gb-weekly-pin.txt)" \
            --as-of "$(cat gb-weekly-as-of.txt)" \
            --catalogue gb-weekly-catalogue.db \
            --csv gb-weekly-original-measures.csv \
            --min-rows 1000000 \
            --output gb-weekly-measures.db
      - name: Resolve official GB remedy condition-component rates at the same pinned version
        shell: bash
        run: |
          set -euo pipefail
          python -m src.target_duty.gb_condition_components \
            --version "$(cat gb-weekly-pin.txt)" \
            --gb-db gb-weekly-measures.db \
            --output gb-weekly-condition-components.json
          python - <<'PY'
          import json
          from pathlib import Path
          pin=Path("gb-weekly-pin.txt").read_text().strip()
          source=json.loads(Path("gb-weekly-condition-components.json").read_text(encoding="utf-8"))
          coverage=source["coverage"]
          assert source["kind"]=="gb-condition-components-v2"
          assert source["version"]==pin
          assert coverage["missing_expected_measure_sids"]==[]
          assert coverage["signature_mismatch_measure_sids"]==0
          assert coverage["condition_entities"]>0
          assert coverage["condition_entities_with_amount"]>0
          print("GB condition components:",json.dumps({k:coverage[k] for k in (
              "expected_measure_sids_with_conditions","condition_entities",
              "condition_entities_with_amount","condition_entities_without_amount",
              "amount_from_older_revision","signature_mismatch_measure_sids")},indent=2))
          PY
      - name: Verify source SHA, all source rows, same pin/date and no payable certification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,sqlite3
          from pathlib import Path
          source=Path("gb-weekly-original-measures.csv")
          report=json.loads(Path("gb-weekly-measures.json").read_text())
          download=json.loads(Path("gb-weekly-source-download.json").read_text())
          meta=json.loads(Path("gb-weekly-catalogue.metadata.json").read_text())
          pin=Path("gb-weekly-pin.txt").read_text().strip()
          day=Path("gb-weekly-as-of.txt").read_text().strip()
          def sha(p):
              h=hashlib.sha256()
              with Path(p).open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()
          assert report["version"]==meta["resolved_version"]==pin
          assert report["as_of"]==meta["as_of"]==day
          geo=json.loads(Path("gb-weekly-geo-area-memberships.json").read_text())
          assert geo["version"]==pin and geo["as_of"]==day
          assert geo["source_sha256"]==sha("gb-weekly-geo-area-memberships.csv")
          refs=json.loads(Path("gb-weekly-geo-area-reference.json").read_text())
          assert geo["geo_areas_source_sha256"]==sha("gb-weekly-geo-areas.csv")==refs["geo-areas"]["sha256"]
          assert geo["geo_area_descriptions_source_sha256"]==sha("gb-weekly-geo-area-descriptions.csv")==refs["geo-area-descriptions"]["sha256"]
          assert geo["active_china_group_count"]>0
          assert geo["kind"]=="dbt-official-geo-area-memberships-v2"
          assert sha(source)==download["sha256"]==report["source_csv_sha256"]
          # Historical fully verified GB export had 1,123,765 source rows.
          # A >10% sudden drop is a source-regression alert requiring review,
          # not proof that all rate semantics are correct.
          assert report["source_rows"]>=1_000_000
          assert report["official_active_leaves"]>=10_000
          assert report["source_commodity_codes"] >= int(
              report["official_active_leaves"]*0.90), "Missing most source commodity coverage"
          assert report["complete_within_dbt_export_scope"]
          assert report["all_import_duties_verified"] is False
          assert report["ni_other_verified"] is False
          assert report["production_eligible"] is False
          assert sha("gb-weekly-measures.db")==report["database_sha256"]
          with sqlite3.connect("file:gb-weekly-measures.db?mode=ro",uri=True) as db:
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert db.execute("SELECT COUNT(*) FROM measures").fetchone()[0]==report["source_rows"]
              assert db.execute("SELECT SUM(row_count) FROM requests").fetchone()[0]==report["source_rows"]
          print("GB weekly full source verified",report["source_rows"],
                "rows /",report["official_active_leaves"],"active leaves")
          print("Candidate source ONLY; not legally payable GB or NI rate")
          PY
      - name: Publish compact GB weekly source baseline for read-only daily watch
        uses: actions/upload-artifact@v4
        with:
          name: gb-daily-watch-pin-${{ github.run_id }}
          path: |
            gb-weekly-pin.txt
            gb-weekly-as-of.txt
            gb-weekly-measures.json
          retention-days: 30
          if-no-files-found: error
      - name: Archive complete source, pinned hashes and separate review database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-gb-full-source-${{ github.run_id }}
          path: |
            gb-weekly-original-measures.csv
            gb-weekly-catalogue.db
            gb-weekly-catalogue.metadata.json
            gb-weekly-measures.db
            gb-weekly-measures.json
            gb-weekly-condition-components.json
            gb-weekly-version-discovery.json
            gb-weekly-source-download.json
            gb-weekly-geo-area-memberships.csv
            gb-weekly-geo-area-memberships.json
            gb-weekly-geo-areas.csv
            gb-weekly-geo-area-descriptions.csv
            gb-weekly-geo-area-reference.json
            gb-weekly-pin.txt
            gb-weekly-as-of.txt
          retention-days: 30
          if-no-files-found: warn
