name: Pinned GB source and compact review validation (evidence only)

on:
  pull_request:
    paths:
      - 'src/target_duty/gb_full_measures.py'
      - 'tests/test_gb_full_measures.py'
      - 'src/target_duty/gb_compact_review.py'
      - 'tests/test_gb_compact_review.py'
      - '.github/workflows/full-gb-official-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-gb-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline full-GB contract tests
        run: python -m unittest discover -s tests -p 'test_gb_full_measures.py' -v
      - name: Offline compact GB targeted candidate contract tests
        run: python -m unittest discover -s tests -p 'test_gb_compact_review.py' -v
      # Reproducible shadow acceptance, NOT a current/latest freshness probe.
      # The latest alias has returned HTTP 404 and must fail closed in the
      # independent freshness flow, not silently substitute old snapshots.
      - name: Download independently pinned official catalogue v4.0.1626
        run: |
          set -euo pipefail
          python -m src.target_duty.catalog build \
            --version v4.0.1626 --output gb-commodity-catalogue.db
          python - <<'PY'
          import json, pathlib
          meta = json.loads(pathlib.Path("gb-commodity-catalogue.metadata.json").read_text())
          version = meta["resolved_version"]
          if version != "v4.0.1626":
              raise ValueError("Official DBT pin unresolved")
          pathlib.Path("official-version.txt").write_text(version)
          print("Pinned full GB source:",version)
          PY
      - name: Build same-version baseline and retrieve FULL official expanded CSV
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat official-version.txt)"
          python -m src.target_duty.build \
            --version "$VERSION" --output focused-gb.db
          python - <<'PY'
          import json
          from pathlib import Path
          from src.target_duty.gb_full_measures import download
          version = Path("official-version.txt").read_text()
          report = download(version, "gb-full-source.csv")
          Path("gb-full-download.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - name: Build complete scope-preserving GB measure evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m src.target_duty.gb_full_measures \
            --csv gb-full-source.csv \
            --catalogue gb-commodity-catalogue.db \
            --focused focused-gb.db \
            --version "$(cat official-version.txt)" \
            --as-of "$(python -c 'import json;print(json.load(open("gb-commodity-catalogue.metadata.json"))["as_of"])')" \
            --min-rows 100000 \
            --output gb-full-measures-shadow.db
          python -m src.target_duty.region_measures query \
            --database gb-full-measures-shadow.db \
            --region GB --code 0207412010 > gb-full-sample.json
      - name: Derive review-only compact GB 103/1011 target evidence and compare manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m src.target_duty.gb_compact_review \
            --full-db gb-full-measures-shadow.db \
            --catalogue gb-commodity-catalogue.db \
            --output gb-compact-103-review.db \
            --max-mb 256
          python - <<'PY'
          import json,sqlite3
          full=json.load(open("gb-full-measures-shadow.json"))
          compact=json.load(open("gb-compact-103-review.json"))
          assert compact["production_eligible"] is False
          assert compact["rate_applicability_verified"] is False
          assert compact["ni_other_verified"] is False
          assert compact["official_active_leaf_codes"]==full["official_active_leaves"]
          assert compact["active_target_codes"]==full["active_103_1011_codes"]
          assert compact["statuses"]["no_expanded_measure_rows_unverified"]==full["active_leaves_without_any_export_rows"]
          with sqlite3.connect("gb-compact-103-review.db") as db:
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert db.execute("SELECT COUNT(*) FROM commodities").fetchone()[0]==full["official_active_leaves"]
              assert db.execute("SELECT COUNT(*) FROM evidence WHERE role='non_gb_103_1080_context' AND geography!='1080'").fetchone()[0]==0
          print("GB official source parity, compact evidence and scope verified")
          PY
      - name: Archive targeted review evidence and immutable source proofs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gb-full-source-proof-${{ github.run_id }}
          path: |
            official-version.txt
            gb-commodity-catalogue.metadata.json
            focused-gb.metadata.json
            gb-full-download.json
            gb-full-measures-shadow.json
            gb-full-sample.json
            gb-compact-103-review.json
            gb-compact-103-review.db
          if-no-files-found: warn
          retention-days: 14
