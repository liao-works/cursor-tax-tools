name: Full GB official measures validation (evidence only)

on:
  pull_request:
    paths:
      - 'src/target_duty/gb_full_measures.py'
      - 'tests/test_gb_full_measures.py'
      - '.github/workflows/full-gb-official-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-gb-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline full-GB contract tests
        run: python -m unittest discover -s tests -p 'test_gb_full_measures.py' -v
      - name: Download independent catalogue and pin immutable source version
        run: |
          set -euo pipefail
          python -m src.target_duty.catalog build \
            --version latest --output gb-commodity-catalogue.db
          python - <<'PY'
          import json, pathlib
          meta = json.loads(pathlib.Path("gb-commodity-catalogue.metadata.json").read_text())
          version = meta["resolved_version"]
          if not version or not version.startswith("v4."):
              raise ValueError("Official DBT pin unresolved")
          pathlib.Path("official-version.txt").write_text(version)
          print("Pinned full GB source:",version)
          PY
      - name: Build same-version baseline and retrieve FULL official expanded CSV
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat official-version.txt)"
          python -m src.target_duty.build \
            --version "$VERSION" --output focused-gb.db
          python - <<'PY'
          import json
          from pathlib import Path
          from src.target_duty.gb_full_measures import download
          version = Path("official-version.txt").read_text()
          report = download(version, "gb-full-source.csv")
          Path("gb-full-download.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - name: Build complete scope-preserving GB measure evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m src.target_duty.gb_full_measures \
            --csv gb-full-source.csv \
            --catalogue gb-commodity-catalogue.db \
            --focused focused-gb.db \
            --version "$(cat official-version.txt)" \
            --as-of "$(python -c 'import json;print(json.load(open("gb-commodity-catalogue.metadata.json"))["as_of"])')" \
            --min-rows 100000 \
            --output gb-full-measures-shadow.db
          python -m src.target_duty.region_measures query \
            --database gb-full-measures-shadow.db \
            --region GB --code 0207412010 > gb-full-sample.json
      - name: Archive only immutable source fingerprints and coverage, not huge data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gb-full-source-proof-${{ github.run_id }}
          path: |
            official-version.txt
            gb-commodity-catalogue.metadata.json
            focused-gb.metadata.json
            gb-full-download.json
            gb-full-measures-shadow.json
            gb-full-sample.json
          if-no-files-found: warn
          retention-days: 14
