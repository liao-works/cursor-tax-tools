name: Official GB commodity catalogue audit (shadow only)

on:
  workflow_dispatch:
  schedule:
    # Daily evidence-only audit; official change/NI APIs are NOT promoted here.
    - cron: '25 8 * * *'

permissions:
  contents: read

jobs:
  catalogue-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline catalogue regression tests
        run: python -m unittest discover -s tests -p 'test_catalog.py' -v
      - name: Download and stage FULL official DBT commodity catalogue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          from src.target_duty.catalog import download_catalog, build
          raw = Path("gb-official-commodities.csv")
          resolved_url = download_catalog("latest", raw)
          result = build(str(raw), "gb-commodity-catalogue.db",
                         as_of=date.today(), source_version="latest",
                         resolved_url=resolved_url)
          print(json.dumps(result, indent=2))
          PY
      - name: Obtain checksum-verified existing production snapshot
        run: python -m src.target_duty.legacy --output legacy-tariffs.db
      - name: Build separate 103/1011 comparison candidate (never promoted)
        run: python -m src.target_duty.build --output focused-gb.db --legacy-db legacy-tariffs.db
      - name: Compare catalogue, legacy and focused GB scopes
        run: |
          python -m src.target_duty.catalog compare \
            --catalogue gb-commodity-catalogue.db \
            --legacy legacy-tariffs.db \
            --focused focused-gb.db \
            --output gb-catalogue-coverage.json
      - name: Preserve source and review evidence (NOT a production release)
        uses: actions/upload-artifact@v4
        with:
          name: gb-official-catalogue-audit-${{ github.run_id }}
          path: |
            gb-official-commodities.csv
            gb-commodity-catalogue.db
            gb-commodity-catalogue.metadata.json
            gb-catalogue-coverage.json
            gb-catalogue-coverage.csv
          retention-days: 14
