name: XI exact effective-date impacted 103/105 source codes (READ ONLY)
on:
  push:
    branches: [feat/target-third-country-duty-v1]
    paths: [ops/xi-date-impact-launch.txt]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-date-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test actual expiry queue, skipped day and SHA tamper regression
        run: python -m unittest discover -s tests -p 'test_xi_date_impact_queue.py' -v
      - name: Retrieve complete condition source SHA-verified original XI public data
        uses: actions/download-artifact@v4
        with:
          name: xi-original-condition-evidence-38668119886
          run-id: 38668119886
          github-token: ${{ github.token }}
          path: evidence
      - name: Find exact commodity codes for candidate expirations through current date
        run: |
          set -euo pipefail
          python -m src.target_duty.xi_date_impact_queue \
            --source-csv evidence/xi-condition-details-candidates.csv \
            --source-summary evidence/xi-condition-details-summary.json \
            --through "$(date -u +%F)" \
            --csv xi-expired-candidate-affected-codes.csv \
            --report xi-expired-candidate-affected-codes.json
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          r=json.loads(Path("xi-expired-candidate-affected-codes.json").read_text())
          with open("xi-expired-candidate-affected-codes.csv",newline="") as f:
              codes=list(csv.DictReader(f))
          assert r["full_original_source_responses"]==16728
          assert r["full_candidate_measure_count"]==17395
          assert len(codes)==r["candidate_effective_end_measures"]
          assert len({x["code"] for x in codes})==r["affected_distinct_codes"]
          assert hashlib.sha256(Path("xi-expired-candidate-affected-codes.csv").read_bytes()).hexdigest()==r["impact_queue_csv_sha256"]
          assert all(x["current_source_refetched"]=="false" and not x["payable_rate"] for x in codes)
          assert not r["production_eligible"] and not r["ni_other_payable_verified"]
          print("Affected NI commodity code count:",r["affected_distinct_codes"])
          PY
      - name: Preserve exact source-only impacted code queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xi-expiry-affected-code-queue-${{ github.run_id }}
          path: |
            xi-expired-candidate-affected-codes.csv
            xi-expired-candidate-affected-codes.json
          if-no-files-found: warn
          retention-days: 30
