name: XI complete public chapter inventory audit (UNTRUSTED source)

on:
  pull_request:
    paths:
      - '.github/workflows/xi-public-full-catalogue-audit.yml'
      - 'src/target_duty/xi_catalogue.py'
      - 'tests/test_xi_catalogue.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xi-public-all-chapters-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify full catalogue scope, schema and fail-closed source rules
        run: python -m unittest discover -s tests -p 'test_xi_catalogue.py' -v
  public-all-chapters:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check that public full inventory stays excluded from managed acceptance
        run: python -m unittest discover -s tests -p 'test_xi_catalogue.py' -v
      - name: Fetch every official XI public chapter (low rate, NO PAYABLE DUTY)
        run: |
          set -euo pipefail
          python -m src.target_duty.xi_catalogue \
            --as-of "$(date -u +%F)" \
            --public-full-audit \
            --min-chapter-interval 2.0 \
            --output xi-all-public-chapters.db
      - name: Independently verify source chapters and candidate inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          report=json.loads(Path("xi-all-public-chapters.json").read_text())
          with sqlite3.connect("xi-all-public-chapters.db") as db:
              meta=dict(db.execute("SELECT key,value FROM metadata"))
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert db.execute("SELECT COUNT(*) FROM chapters").fetchone()[0]==report["official_listed_chapters"]
              assert db.execute("SELECT COUNT(*) FROM nomenclature").fetchone()[0]==report["nomenclature_rows"]
              assert db.execute("""SELECT COUNT(DISTINCT code) FROM nomenclature
                                   WHERE active=1 AND declarable=1""").fetchone()[0]==report["active_declarable_entries"]
              assert meta["listing_scope"]=="public_full_untrusted"
              assert meta["production_eligible"]=="false"
          assert report["chapters_complete"]==97
          assert report["unknown_declarability_entries"]==0
          assert report["official_listed_chapters"]==97
          assert report["listing_scope"]=="public_full_untrusted"
          assert report["production_eligible"] is False
          assert report["atomic_version_proven"] is False
          assert report["other_semantics_verified"] is False
          assert report["measures_imported"]==0
          print("Official XI FULL PUBLIC catalogue audited:",
                report["chapters_complete"],"chapters",
                report["nomenclature_rows"],"goods records",
                report["active_declarable_entries"],"active declarable codes")
          print("This is untrusted public source inventory, NOT managed coverage or XI Other rates")
          PY
      - name: Preserve official public all-chapter snapshot and limitations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xi-public-all-chapters-${{ github.run_id }}
          path: |
            xi-all-public-chapters.db
            xi-all-public-chapters.json
          retention-days: 7
          if-no-files-found: warn
