name: XI Other candidate audit (manual only)
on:
  workflow_dispatch:
    inputs:
      commodity_code:
        description: 'One 10-digit commodity code to audit'
        type: string
        required: true
        default: '0101210000'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HMRC_CLIENT_ID: ${{ secrets.HMRC_CLIENT_ID }}
      HMRC_CLIENT_SECRET: ${{ secrets.HMRC_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run local XI selector tests
        run: python -m unittest discover -s tests -p test_xi_probe.py -v
      - name: Validate credentials without logging secrets
        run: |
          if [ -z "$HMRC_CLIENT_ID" ] || [ -z "$HMRC_CLIENT_SECRET" ]; then
            echo "HMRC portal OAuth secrets are not configured"
            exit 1
          fi
      - name: Probe XI official machine-readable candidates
        run: |
          python -m src.target_duty.xi_probe --code "${{ inputs.commodity_code }}" --output xi-candidate-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: xi-candidate-audit
          path: xi-candidate-report.json
          retention-days: 7
