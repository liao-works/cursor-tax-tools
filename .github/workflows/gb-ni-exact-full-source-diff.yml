name: Full GB/NI official source exact code diff (REVIEW ONLY)
on:
  # One-time operator request for an exact trusted old/new full source diff.
  push:
    branches: [feat/parallel-scraper]
    paths: [ops/manual-full-diff-run.txt]
  # Automatically compare each accepted GB/XI full snapshot to its preceding accepted run.
  workflow_run:
    workflows:
      - Weekly GB full official source refresh and pinned replay (SHADOW ONLY)
      - XI public full raw measure evidence (UNTRUSTED SHADOW)
    types: [completed]
    branches: [feat/parallel-scraper]
  workflow_dispatch:
    inputs:
      region:
        description: Two independently complete source snapshots from one region
        type: choice
        options: [GB, XI]
        required: true
      before_run_id:
        description: Previous complete source capture run ID
        required: true
        type: string
      after_run_id:
        description: New complete source capture run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: full-source-diff-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-code-diff:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      has_pair: ${{ steps.pair.outputs.has_pair }}
      region: ${{ steps.pair.outputs.region }}
      after: ${{ steps.pair.outputs.after }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select trusted latest full source and previous independently accepted snapshot
        id: pair
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REGION_INPUT: ${{ inputs.region }}
          BEFORE_INPUT: ${{ inputs.before_run_id }}
          AFTER_INPUT: ${{ inputs.after_run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          def api(path):
              return json.loads(subprocess.check_output(["gh","api",path],text=True))
          repository=os.environ["GITHUB_REPOSITORY"]
          def positive(s):
              if not re.fullmatch(r"[0-9]{8,16}",str(s)):
                  raise ValueError("Missing/invalid source workflow run ID")
              return int(s)
          if os.environ["EVENT_NAME"]=="workflow_run":
              event=json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              triggering=event["workflow_run"]
              allowed={
                  "Weekly GB full official source refresh and pinned replay (SHADOW ONLY)":
                      ("GB","weekly-gb-full-source.yml","weekly-gb-full-source"),
                  "XI public full raw measure evidence (UNTRUSTED SHADOW)":
                      ("XI","xi-public-full-measures.yml","xi-public-full-acceptance"),
              }
              region,workflow,prefix=allowed[triggering["name"]]
              if (triggering["conclusion"]!="success"
                      or triggering["head_repository"]["full_name"]!=repository
                      or triggering["head_branch"]!="feat/parallel-scraper"
                      or triggering["event"] not in ("schedule","workflow_dispatch","push")):
                  raise ValueError("Untrusted or unfinished full source workflow event")
              after=positive(triggering["id"])
              completed=api(f"repos/{repository}/actions/workflows/{workflow}/runs?branch=feat/parallel-scraper&status=success&per_page=50")["workflow_runs"]
              before=None
              for r in completed:
                  candidate=r["id"]
                  if candidate>=after or r.get("created_at","")>=triggering["created_at"]:
                      continue
                  if r.get("head_branch")!="feat/parallel-scraper":
                      continue
                  artifacts=api(f"repos/{repository}/actions/runs/{candidate}/artifacts?per_page=100")["artifacts"]
                  if any(a["name"]==f"{prefix}-{candidate}" and not a["expired"] for a in artifacts):
                      before=candidate
                      break
          else:
              if os.environ["EVENT_NAME"]=="push":
                  content=Path("ops/manual-full-diff-run.txt").read_text()
                  values=dict(re.findall(r"(?m)^(region|before_run_id|after_run_id)=([A-Za-z0-9]+)$",content))
                  region=values.get("region")
                  before=positive(values.get("before_run_id"))
                  after=positive(values.get("after_run_id"))
              else:
                  region=os.environ["REGION_INPUT"]
                  before=positive(os.environ["BEFORE_INPUT"])
                  after=positive(os.environ["AFTER_INPUT"])
              if region not in ("GB","XI"):
                  raise ValueError("Select GB or XI")
          if before is not None and before==after:
              raise ValueError("Must use two distinct verified source snapshots")
          found=before is not None
          if not found:
              print("::warning::No earlier identical-format accepted source snapshot; cannot make up a diff")
          print(f"Region={region}; earlier={before}; later={after}; comparable={found}")
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              print(f"region={region}",file=output)
              print(f"before={before or ''}",file=output)
              print(f"after={after}",file=output)
              print(f"has_pair={str(found).lower()}",file=output)
          PY
      - name: Download older GB full official measures
        if: steps.pair.outputs.has_pair == 'true' && steps.pair.outputs.region == 'GB'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.pair.outputs.before }}
          name: weekly-gb-full-source-${{ steps.pair.outputs.before }}
          github-token: ${{ github.token }}
          path: before
      - name: Download newer GB full official measures
        if: steps.pair.outputs.has_pair == 'true' && steps.pair.outputs.region == 'GB'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.pair.outputs.after }}
          name: weekly-gb-full-source-${{ steps.pair.outputs.after }}
          github-token: ${{ github.token }}
          path: after
      - name: Download older independently accepted XI raw source
        if: steps.pair.outputs.has_pair == 'true' && steps.pair.outputs.region == 'XI'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.pair.outputs.before }}
          name: xi-public-full-acceptance-${{ steps.pair.outputs.before }}
          github-token: ${{ github.token }}
          path: before
      - name: Download newer independently accepted XI raw source
        if: steps.pair.outputs.has_pair == 'true' && steps.pair.outputs.region == 'XI'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.pair.outputs.after }}
          name: xi-public-full-acceptance-${{ steps.pair.outputs.after }}
          github-token: ${{ github.token }}
          path: after
      - name: Source provenance and non-103 measure change regression
        if: steps.pair.outputs.has_pair == 'true'
        run: python -m unittest discover -s tests -p 'test_full_source_delta_scope.py' -v
      - name: Compare entire original official source by exact commodity code
        if: steps.pair.outputs.has_pair == 'true'
        env:
          REGION: ${{ steps.pair.outputs.region }}
        run: |
          set -euo pipefail
          case "$REGION" in
            GB) SRC="gb-weekly-measures.db";;
            XI) SRC="xi-public-full-merged.db";;
            *) exit 1;;
          esac
          python -m src.target_duty.full_source_delta_scope \
            --region "$REGION" --before "before/$SRC" --after "after/$SRC" \
            --csv exact-changed-codes.csv --report exact-diff-report.json
          python - <<'PY'
          import csv,hashlib,json
          r=json.load(open("exact-diff-report.json"))
          with open("exact-changed-codes.csv",newline="") as f: rows=list(csv.DictReader(f))
          assert r["affected_codes"]==len(rows)
          assert r["changed_code_csv_sha256"]==hashlib.sha256(
              open("exact-changed-codes.csv","rb").read()).hexdigest()
          assert not r["production_eligible"] and not r["ni_other_verified"]
          assert r["legal_payable_rates_produced"]==0
          assert all(x["payable_rate"]=="" and x["production_eligible"]=="false" for x in rows)
          print("Exact source changed commodity codes:",len(rows))
          PY
      - name: Save source code diffs and hashes, NEVER publish
        if: always() && steps.pair.outputs.has_pair == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: full-source-exact-impact-${{ github.run_id }}
          path: |
            exact-changed-codes.csv
            exact-diff-report.json
          retention-days: 30
          if-no-files-found: warn
  publish-desktop-data:
    # Only after a completed, independently accepted, exact full-source diff.
    # Publish only on verified default-branch full-source events or an explicit
    # default-branch operator source-diff marker (never PR or workflow_dispatch).
    needs: exact-code-diff
    if: (github.event_name == 'workflow_run' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/parallel-scraper')) && needs.exact-code-diff.outputs.has_pair == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: write
      actions: read
    concurrency:
      group: desktop-published-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/parallel-scraper
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Choose latest completed GB and XI full snapshots with authentic same-repo artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER: ${{ needs.exact-code-diff.outputs.after }}
          REGION: ${{ needs.exact-code-diff.outputs.region }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from datetime import datetime,timezone
          def api(path):
              return json.loads(subprocess.check_output(["gh","api",path],text=True))
          repo=os.environ["GITHUB_REPOSITORY"]
          after=int(os.environ["AFTER"])
          region=os.environ["REGION"]
          found={}
          configs={
              "GB":("weekly-gb-full-source.yml","weekly-gb-full-source"),
              "XI":("xi-public-full-measures.yml","xi-public-full-acceptance"),
          }
          for part,(workflow,prefix) in configs.items():
              runs=api(f"repos/{repo}/actions/workflows/{workflow}/runs?branch=feat/parallel-scraper&status=success&per_page=40")["workflow_runs"]
              for run in runs:
                  if part==region and run["id"]!=after:
                      continue
                  if run["head_branch"]!="feat/parallel-scraper" or run["head_repository"]["full_name"]!=repo:
                      continue
                  artifacts=api(f"repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100")["artifacts"]
                  if any(a["name"]==f"{prefix}-{run['id']}" and not a["expired"] for a in artifacts):
                      found[part]=run["id"]
                      break
          if set(found)!={"GB","XI"}:
              print("::warning::Both independently accepted source snapshots not yet available")
              with open(os.environ["GITHUB_OUTPUT"],"a") as dest:
                  print("ready=false",file=dest)
          else:
              with open(os.environ["GITHUB_OUTPUT"],"a") as dest:
                  print("ready=true",file=dest)
                  print(f"gb_run={found['GB']}",file=dest)
                  print(f"xi_run={found['XI']}",file=dest)
              print("Source-only full snapshot IDs:",found)
          PY
      - name: Download complete accepted GB source and commodity catalogue
        if: steps.source.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.source.outputs.gb_run }}
          name: weekly-gb-full-source-${{ steps.source.outputs.gb_run }}
          github-token: ${{ github.token }}
          path: gb
      - name: Download complete accepted XI original responses
        if: steps.source.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.source.outputs.xi_run }}
          name: xi-public-full-acceptance-${{ steps.source.outputs.xi_run }}
          github-token: ${{ github.token }}
          path: xi
      - name: Download XI frozen official catalogue and manifest for independently checked source SHA
        if: steps.source.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.source.outputs.xi_run }}
          name: xi-public-full-catalogue-${{ steps.source.outputs.xi_run }}
          github-token: ${{ github.token }}
          path: xi
      - name: Capture same-as-of official XI geographical area tree for China applicability
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          XI_AS_OF="$(python -c 'import json; print(json.load(open("xi/xi-public-frozen-manifest.json"))["as_of"])')"
          python -m src.target_duty.xi_geographical_areas \
            --as-of "$XI_AS_OF" \
            --output xi/xi-geographical-areas.json \
            --report xi/xi-geographical-areas-report.json
      - name: Build complete desktop release with source SHA/coverage and SQLite integrity checks
        if: steps.source.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p desktop
          python -m src.target_duty.desktop_release_bundle \
            --gb-db gb/gb-weekly-measures.db \
            --gb-catalogue gb/gb-weekly-catalogue.db \
            --xi-db xi/xi-public-full-merged.db \
            --xi-catalogue xi/xi-public-full-catalogue.db \
            --xi-manifest xi/xi-public-frozen-manifest.json \
            --geo-memberships gb/gb-weekly-geo-area-memberships.csv \
            --geo-memberships-report gb/gb-weekly-geo-area-memberships.json \
            --geo-areas gb/gb-weekly-geo-areas.csv \
            --geo-area-descriptions gb/gb-weekly-geo-area-descriptions.csv \
            --xi-geographical-areas xi/xi-geographical-areas.json \
            --xi-geographical-areas-report xi/xi-geographical-areas-report.json \
            --output-db desktop/tariffs.db \
            --output-metadata desktop/metadata.json
          python - <<'PY'
          import hashlib,json,sqlite3
          from pathlib import Path
          m=json.loads(Path("desktop/metadata.json").read_text())
          data=Path("desktop/tariffs.db").read_bytes()
          audit_path=Path("desktop/rate-gap-audit.json")
          audit_bytes=audit_path.read_bytes()
          audit=json.loads(audit_bytes)
          assert hashlib.sha256(data).hexdigest()==m["file_hash"].split(":")[1]
          assert hashlib.sha256(audit_bytes).hexdigest()==m["default_rate_gap_audit"]["sha256"].split(":")[1]
          assert audit["record_count"]==len(audit["records"])==m["default_rate_gap_audit"]["record_count"]
          assert audit["source_versions"]==m["source_versions"]
          assert audit["record_count"]==sum(m["default_duty_coverage"][region]["codes_without_default_duty"] for region in ("GB","XI"))
          with sqlite3.connect("desktop/tariffs.db") as db:
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert db.execute("SELECT COUNT(*) FROM tariffs").fetchone()[0]==m["record_count"]
          assert m["coverage"]["GB"]>=10000 and m["coverage"]["XI"]>=10000
          PY
      - name: Keep desktop metadata and binary evidence even if release API fails
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: accepted-desktop-data-candidate-${{ github.run_id }}
          path: |
            desktop/tariffs.db
            desktop/metadata.json
            desktop/rate-gap-audit.json
          retention-days: 30
      - name: Publish versioned immutable data and latest-data only if actual bytes changed
        if: steps.source.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json;print(json.load(open("desktop/metadata.json"))["version"])')"
          HASH="$(python -c 'import json;print(json.load(open("desktop/metadata.json"))["file_hash"])')"
          echo "Built source-reviewed $VERSION with $HASH"
          # Do not notify installed desktops for an unchanged SQLite content hash.
          if gh release view latest-data --json tagName >/dev/null 2>&1; then
            mkdir -p previous
            gh release download latest-data -p metadata.json -D previous
            PREVIOUS="$(python -c 'import json;print(json.load(open("previous/metadata.json")).get("file_hash",""))')"
            if [[ "$PREVIOUS" == "$HASH" ]]; then
              PREVIOUS_VERSION="$(python -c 'import json;print(json.load(open("previous/metadata.json")).get("version",""))')"
              python - "$PREVIOUS_VERSION" <<'PY'
          import json,sys
          from pathlib import Path
          version=sys.argv[1]
          if not version:
              raise SystemExit("Existing latest-data metadata has no immutable version")
          path=Path("desktop/metadata.json")
          metadata=json.loads(path.read_text(encoding="utf-8"))
          metadata["version"]=version
          path.write_text(json.dumps(metadata,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
              PREVIOUS_META_FINGERPRINT="$(python -c 'import hashlib,json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); [d.pop(k,None) for k in ("timestamp","last_modified","version")]; print(hashlib.sha256(json.dumps(d,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode("utf-8")).hexdigest())' previous/metadata.json)"
              NEW_META_FINGERPRINT="$(python -c 'import hashlib,json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); [d.pop(k,None) for k in ("timestamp","last_modified","version")]; print(hashlib.sha256(json.dumps(d,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode("utf-8")).hexdigest())' desktop/metadata.json)"
              PREVIOUS_AUDIT_HASH="missing"
              if gh release download latest-data -p rate-gap-audit.json -D previous >/dev/null 2>&1; then
                PREVIOUS_AUDIT_HASH="$(sha256sum previous/rate-gap-audit.json | cut -d ' ' -f1)"
              fi
              NEW_AUDIT_HASH="$(sha256sum desktop/rate-gap-audit.json | cut -d ' ' -f1)"
              if [[ "$PREVIOUS_META_FINGERPRINT" != "$NEW_META_FINGERPRINT" || "$PREVIOUS_AUDIT_HASH" != "$NEW_AUDIT_HASH" ]]; then
                gh release upload latest-data desktop/metadata.json desktop/rate-gap-audit.json --clobber
                echo "::notice::Updated metadata and default-rate gap audit without changing SQLite; no duplicate desktop notification"
              else
                echo "::notice::Database bytes, source metadata, and default-rate gap audit unchanged; suppressing duplicate desktop notification"
              fi
              exit 0
            fi
          fi
          # Version tag acts as permanent auditable rollback/verification copy.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Immutable data tag already exists for a changed publish"
            exit 1
          fi
          gh release create "$VERSION" desktop/tariffs.db desktop/metadata.json desktop/rate-gap-audit.json \
            --target "${GITHUB_SHA}" --title "Tariff data $VERSION" \
            --notes "Complete GB/XI source snapshot. Default fields contain only unambiguous active China-applicable type 103 duties (percentage, specific or compound); conditional/special-use options and trade remedies are preserved separately. The default-rate gap audit is attached; no blank is inferred as zero."
          if gh release view latest-data >/dev/null 2>&1; then
            gh release upload latest-data desktop/tariffs.db desktop/metadata.json desktop/rate-gap-audit.json --clobber
          else
            gh release create latest-data desktop/tariffs.db desktop/metadata.json desktop/rate-gap-audit.json \
              --target "${GITHUB_SHA}" --title "Latest desktop tariff data" \
              --notes "Current GB/XI full-source desktop database. Default duties are separated from conditional measures; the full gap audit is published alongside the database."
          fi
          echo "::notice::New released data $VERSION; desktop clients will detect new SHA-256 within 24h"
