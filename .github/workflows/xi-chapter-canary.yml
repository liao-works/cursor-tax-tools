name: XI official chapter source canary (untrusted public shadow)

on:
  pull_request:
    paths:
      - 'src/target_duty/xi_catalogue.py'
      - 'tests/test_xi_catalogue.py'
      - 'src/target_duty/xi_measure_crawl.py'
      - 'tests/test_xi_measure_crawl.py'
      - 'src/target_duty/xi_acceptance.py'
      - 'tests/test_xi_acceptance.py'
      - 'src/target_duty/xi_run_plan.py'
      - 'tests/test_xi_run_plan.py'
      - 'src/target_duty/xi_origin_compare.py'
      - 'tests/test_xi_origin_compare.py'
      - '.github/workflows/xi-chapter-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xi-source-schema-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate XI nomenclature schema locally
        run: python -m unittest discover -s tests -p 'test_xi_catalogue.py' -v
      - name: Probe ONLY two official XI chapter endpoints (not production coverage)
        run: |
          python -m src.target_duty.xi_catalogue \
            --as-of 2026-10-14 \
            --public-canary --max-chapters 2 \
            --output xi-catalogue-canary.db
      - name: Probe only five XI commodity measure responses (public review-only)
        run: |
          python -m src.target_duty.xi_measure_crawl \
            --catalogue xi-catalogue-canary.db \
            --as-of 2026-10-14 --limit 5 --min-interval 1.5 \
            --public-canary --output xi-measures-canary.db
      - name: Verify stored XI API bytes, measures and incomplete 2-chapter coverage
        run: |
          python -m src.target_duty.xi_acceptance \
            --catalogue xi-catalogue-canary.db \
            --measures xi-measures-canary.db \
            --output xi-acceptance-canary.json
      - name: Compare one XI code using US and CN origin-specific official filters
        run: |
          python -m src.target_duty.xi_origin_compare \
            --code 0101210000 --as-of 2026-10-14 \
            --origins US,CN --public-canary \
            --min-interval 1.5 \
            --output xi-origin-comparison-canary.db
      - name: Independently plan next XI public canary shard from verified checkpoint
        run: |
          python -m src.target_duty.xi_run_plan \
            --catalogue xi-catalogue-canary.db \
            --checkpoint xi-measures-canary.db \
            --public-canary --batch-size 5 \
            --output xi-next-shard-canary.json
          python - <<'PY'
          import json
          a=json.load(open("xi-next-shard-canary.json"))
          assert a["source_scope"]=="partial_or_fixture"
          assert a["remaining_codes"]==511
          assert a["next_shard"]["start_index"]==5
          assert a["all_managed_source_responses_verified"] is False
          assert a["ni_other_verified"] is False
          print("XI limited canary next shard and missing codes verified")
          PY
      - name: Preserve only limited XI public probe evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xi-public-chapter-canary-${{ github.run_id }}
          path: |
            xi-catalogue-canary.db
            xi-catalogue-canary.json
            xi-measures-canary.db
            xi-measures-canary.db.metadata.json
            xi-acceptance-canary.json
            xi-next-shard-canary.json
            xi-origin-comparison-canary.json
            xi-origin-comparison-canary.db
          if-no-files-found: warn
          retention-days: 7
